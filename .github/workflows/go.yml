name: Go

on:
  push:
    branches: [ "trunk", "main" ]
  pull_request:
    branches: [ "trunk", "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Install Z3
      run: |
        sudo apt-get update
        sudo apt-get install -y libz3-dev

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
